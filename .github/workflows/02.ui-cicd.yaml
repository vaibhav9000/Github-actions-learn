name: Deploy Project
# on: [push, workflow_dispatch, pull_request]
on: workflow_dispatch
jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - name: Get code # an action to pull github repo in the runner instance
              uses: actions/checkout@v3 # a pre defined complex action i.e. repeated task
            - name: Install node.js
              uses: actions/setup-node@v3
              with: # providing configuration to action
                node-version: 26
            - name: Install dependencies
              working-directory: frontend
              run: npm ci
            - name: Run tests
              working-directory: frontend
              run: npm run test
    
    deploy:
        needs: test # can also be accepted as a list of jobs, it is used to define the dependency between jobs
        runs-on: ubuntu-latest
        steps: 
            - name: Get code
              uses: actions/checkout@v3
            - name: Install node.js
              uses: actions/setup-node@v3
              with:
                node-version: 26
            - name: Install dependencies
              working-directory: frontend
              run: npm ci
            - name: Build project
              working-directory: frontend
              run: npm run build
            - name: Deploy
              run: echo "Deploying ..."