name: Artifacts
on: workflow_dispatch
defaults:
    run:
        working-directory: frontend
jobs: 
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: Npm install
              run: npm ci
            - name: Npm build
              run: npm build
            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: dist-files
                path: |
                    dist
                    package.json
                    package-lock.json
