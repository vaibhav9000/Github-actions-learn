name: First Workflow
on: [workflow_dispatch] # will trigger through button, push or pull_request
jobs:
  first-job: # name of the first job
    runs-on: ubuntu-latest # provide os/platform to the github instance
    steps:
      - name: Hello world
        run: echo "Hello World" # shell command to perform anything on instance
      - name: Goodbye
        run: echo "Goodbye"

  second-job: # name of the second job
    runs-on: ubuntu-latest
    steps:
      - name: Multi line commands
        run: |
          echo "First output"
          echo "Second output"