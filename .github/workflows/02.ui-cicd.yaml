name: Deploy Project
on: [push, workflow_dispatch, pull_request]
jobs:
    test:
        runs-on: ubuntu-latest
        steps: 
            - name: Get code # an action to pull github repo in the runner instance
              uses: actions/checkout@v3 # a pre defined complex action i.e. repeated task
            - name: Install node.js
              uses: actions/setup-node@v3
              with: # providing configuration to action
                node-version: 26
            - name: Install dependencies
              run:  cd frontend & npm ci
            - name: Run tests
              run: cd frontend & npm run test
    
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps: 
            - name: Get code
              uses: actions/checkout@v3
            - name: Install node.js
              uses: actions/setup-node@v3
              with:
                node-version: 26
            - name: Install dependencies
              run: cd frontend & npm ci
            - name: Build project
              run: cd frontend & npm run build
            - name: Deploy
              run: echo "Deploying ..."